services:
  app:
    image: ${APP_IMAGE:-ghcr.io/jamesflare1212/engr-4010-under-the-green-light:latest}
    pull_policy: always
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: ${COMPOSE_PROJECT_NAME:-engr-4010-under-the-green-light}
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/green-light.sqlite
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
    volumes:
      - green-light-data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    read_only: true
    init: true
    restart: unless-stopped
    stop_grace_period: 10s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  watchtower:
    image: nickfedor/watchtower:1.23.1
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCOPE: ${COMPOSE_PROJECT_NAME:-engr-4010-under-the-green-light}
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-60}
      WATCHTOWER_TIMEOUT: 30s
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      com.centurylinklabs.watchtower.scope: ${COMPOSE_PROJECT_NAME:-engr-4010-under-the-green-light}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  green-light-data:
